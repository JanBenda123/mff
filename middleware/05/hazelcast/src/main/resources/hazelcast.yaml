hazelcast:
  network:
    # Make sure we use a localhost address.
    interfaces:
      enabled: true
      interfaces: [127.0.0.1]
    # The first member is assigned address 127.0.0.1:5701.
    # The following are assigned port 5702 and so on.
    join:
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        members:
          127.0.0.1:5701
  map:
    TheMap: {
      # Put the configuration of the distributed hash map here.
    }
